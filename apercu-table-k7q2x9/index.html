<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aperçu 3D — Table Vulkan</title>
<meta name="robots" content="noindex, nofollow, noarchive" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="stylesheet" href="/fonts/fonts.css" />
<script type="module" src="model-viewer.min.js"></script>
<style>
:root{--bg:#0a0a0c;--line:#20232b;--ink:#f3f4f6;--dim:#9aa0ad;--accent:#8ab4ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter",sans-serif;line-height:1.6}
main{max-width:1100px;margin:0 auto;padding:2.5rem 5% 3rem}
h1{font-family:"Space Grotesk",sans-serif;font-size:1.7rem;margin:0 0 .4rem}
p.sub{color:var(--dim);margin:0 0 1.4rem;font-size:.95rem}
.stage{position:relative;aspect-ratio:3/2;width:100%;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(#f4f3f1,#e4e2de)}
model-viewer{width:100%;height:100%;--poster-color:transparent}
.loading{position:absolute;inset:auto 0 12px 0;text-align:center;font-size:.85rem;color:#6b675e;pointer-events:none}
.bar{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem;align-items:center}
.bar button{font:inherit;cursor:pointer;padding:.5rem 1rem;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);display:flex;gap:.55rem;align-items:center}
.bar button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.sw{width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,.35)}
.spacer{flex:1}
.info{color:var(--dim);font-size:.85rem;margin-top:1rem}
[hidden]{display:none!important}
</style>
</head><body><main>
<h1>Table Vulkan 240 × 110</h1>
<p class="sub">Béton ciré. Faites glisser pour tourner, molette ou pincement pour zoomer. Aperçu de travail, version non définitive.</p>
<div class="stage">
<model-viewer id="mv" src="table_beige.glb" alt="Table Vulkan en béton ciré"
 camera-controls touch-action="pan-y" auto-rotate auto-rotate-delay="3000" interaction-prompt="none"
 camera-orbit="35deg 68deg auto" field-of-view="25deg" min-field-of-view="12deg" max-field-of-view="40deg"
 environment-image="neutral" exposure="1.0" tone-mapping="aces" shadow-intensity="1.1" shadow-softness="1"
 ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed"></model-viewer>
<div class="loading" id="loading">Chargement du modèle…</div>
</div>
<div class="bar" role="group" aria-label="Finition">
<button type="button" data-src="table_beige.glb" aria-pressed="true"><span class="sw" style="background:#d3c8b4"></span>Beige</button>
<button type="button" data-src="table_vert.glb" aria-pressed="false"><span class="sw" style="background:#6b7040"></span>Vert olive</button>
<span class="spacer"></span>
<button type="button" id="rot" aria-pressed="true">Rotation auto</button>
</div>
<p class="info" id="info">Le premier chargement peut prendre quelques secondes (environ 10 Mo).</p>
</main>
<script>
const mv=document.getElementById('mv'),info=document.getElementById('info');
const finish=[...document.querySelectorAll('[data-src]')];
finish.forEach(b=>b.addEventListener('click',()=>{
 finish.forEach(x=>x.setAttribute('aria-pressed',x===b));
 const cam=mv.getCameraOrbit(),fov=mv.getFieldOfView();
 mv.src=b.dataset.src;mv.cameraOrbit=cam.toString();mv.fieldOfView=fov+'deg';
}));
document.getElementById('rot').addEventListener('click',e=>{
 const on=e.currentTarget.getAttribute('aria-pressed')!=='true';
 e.currentTarget.setAttribute('aria-pressed',on);mv.autoRotate=on;
});
mv.addEventListener('progress',e=>{document.getElementById('loading').hidden=e.detail.totalProgress>=1});
mv.addEventListener('error',()=>{info.textContent='Le modèle 3D n’a pas pu se charger. Rechargez la page.'});
</script>
</body></html>
